name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy

    # The examples read benchmark datasets through the hdf5 dev-dependency,
    # which links against the system HDF5 library.
    - name: Install HDF5
      run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-

    - name: Check Rust formatting
      run: cargo fmt --check

    # --locked: build against the committed Cargo.lock (including the pinned
    # anndists git revision) and FAIL if it would need to change, keeping CI
    # reproducible. Default features enable simdeez_f.
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0

    - name: Install HDF5
      run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Test
      run: cargo test --locked
